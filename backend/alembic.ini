# Alembic configuration for StudyFetch AI Tutor backend.
#
# The database URL is NOT set here — it is read from the DATABASE_URL environment
# variable in migrations/env.py (same source the application uses). This keeps a
# single source of truth for connection config and avoids committing credentials.
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
